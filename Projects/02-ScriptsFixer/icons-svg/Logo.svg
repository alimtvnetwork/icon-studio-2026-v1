<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ScriptsFixer logo">
  <defs>
    <linearGradient id="sfBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="55%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="sfSpark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <!-- App-icon tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#sfBg)"/>

  <!-- subtle code rails (kept clear of mark + badge zones) -->
  <g opacity="0.14" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round">
    <path d="M64 96 L160 96"/>
    <path d="M64 118 L208 118"/>
    <path d="M64 416 L176 416"/>
  </g>

  <!-- Bracket lockup, scaled + lifted so the badge corner stays empty -->
  <!-- Reserved badge zone: bottom-right ~ x>=320, y>=320 -->
  <g transform="translate(-12 -28)">
    <path d="M176 176 L108 256 L176 336"
          fill="none" stroke="#FFFFFF" stroke-width="32"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M296 176 L364 256 L296 336"
          fill="none" stroke="#FFFFFF" stroke-width="32"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M268 160 L208 352"
          fill="none" stroke="#FFFFFF" stroke-width="26"
          stroke-linecap="round"/>
  </g>

  <!-- Repair badge bottom-right — checkmark + spark, no collision with brackets -->
  <g transform="translate(396 396)">
    <circle cx="0" cy="0" r="68" fill="#0F172A" stroke="#FFFFFF" stroke-width="7"/>
    <path d="M-26 2 L-6 22 L28 -18"
          fill="none" stroke="#FFFFFF" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(40 -40)">
      <path d="M0 -12 L4 -4 L12 0 L4 4 L0 12 L-4 4 L-12 0 L-4 -4 Z"
            fill="url(#sfSpark)" stroke="#0F172A" stroke-width="1.5"/>
    </g>
  </g>
</svg>